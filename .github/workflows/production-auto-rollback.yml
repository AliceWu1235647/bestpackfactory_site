name: BestPack Production Acceptance and Rollback

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: bestpack-production-acceptance
  cancel-in-progress: false

jobs:
  production-acceptance:
    name: guardrails / production-acceptance
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify production
        id: acceptance
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-preview.mjs --url https://www.bestpackfactory.com --retries 3 --asset-mode head --concurrency 16

      - name: Prepare pinned Vercel CLI
        if: steps.acceptance.outcome == 'failure'
        run: npm install --global vercel@56.3.2

      - name: Bind only the approved Vercel project
        if: steps.acceptance.outcome == 'failure'
        run: |
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({projectId:'prj_xXGSQzpuzCiQrlGWUfMZ3h1ZvKf4',orgId:'team_imNQTfSTG7UsB1hYxcv1bok0',projectName:'bestpackfactory-site-gmrk'}))"

      - name: Roll back failed production deployment
        if: steps.acceptance.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel rollback --yes --token "$VERCEL_TOKEN"

      - name: Fail the deployment check after rollback
        if: steps.acceptance.outcome == 'failure'
        run: exit 1
