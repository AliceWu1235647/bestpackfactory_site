name: Site protection

on:
  pull_request:
  push:
    branches:
      - restored-correct-20260904

permissions:
  contents: read

jobs:
  protect-existing-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run guard:site
      - run: npm run test:dielines
      - run: npm run check:sitemap
      - run: npm run build
      - run: npm run guard:site
